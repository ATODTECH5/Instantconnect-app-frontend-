name: Build and update on push to main

on:
  push:
    branches:
      - main

jobs:
  fingerprint:
    name: Fingerprint
    type: fingerprint

  get_android_build:
    name: Check for existing Android build
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      profile: preview

  # Skipped when a build already matches the fingerprint, so JS only pushes do
  # not spend ~45 minutes of build minutes producing an identical binary.
  build_android:
    name: Build Android APK
    needs: [get_android_build]
    if: ${{ !needs.get_android_build.outputs.build_id }}
    type: build
    params:
      platform: android
      profile: preview

  # No `needs` on purpose: this must publish on every push, including the ones
  # where build_android is skipped, since it is what reaches installed APKs.
  publish_update:
    name: Publish OTA update
    type: update
    params:
      platform: android
      branch: preview
